name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Package source and Windows portable release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test backend
        run: python -m unittest -v tests/test_underrail_webapp.py tests/test_next_frontend.py
      - name: Build frontend static export
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build Python package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Build Windows portable folder
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --noconfirm packaging/underrail-respec-editor.spec
      - name: Create release artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "underrail-respec-editor-$tag"
          New-Item -ItemType Directory -Force -Path "release/$name" | Out-Null
          $items = @(
            "README.md", "LICENSE", "NOTICE.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md",
            "docs", "pyproject.toml", "src", "tests", "data", "scripts", "packaging", "frontend", "runtime-patcher"
          )
          foreach ($item in $items) { Copy-Item $item "release/$name" -Recurse -Force }
          Remove-Item "release/$name/frontend/node_modules" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "release/$name/frontend/.next" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "release/$name/frontend/out" -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "release/$name" -DestinationPath "underrail-respec-editor-$tag-source.zip"
          Copy-Item README.md dist/underrail-respec-editor/README.md -Force
          Copy-Item LICENSE dist/underrail-respec-editor/LICENSE -Force
          Copy-Item NOTICE.md dist/underrail-respec-editor/NOTICE.md -Force
          New-Item -ItemType Directory -Force -Path dist/underrail-respec-editor/docs | Out-Null
          Copy-Item docs/RELEASE_NOTES_v0.0.4.md dist/underrail-respec-editor/docs/RELEASE_NOTES_v0.0.4.md -Force
          Compress-Archive -Path "dist/underrail-respec-editor" -DestinationPath "underrail-respec-editor-$tag-windows-portable.zip"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: docs/RELEASE_NOTES_v0.0.4.md
          files: |
            underrail-respec-editor-${{ github.ref_name }}-source.zip
            underrail-respec-editor-${{ github.ref_name }}-windows-portable.zip
            dist/*.whl
            dist/*.tar.gz
