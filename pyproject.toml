[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "underrail-respec-editor"
version = "0.0.2"
description = "Local clone-first Underrail save respec editor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MotionCorrect" }]
keywords = ["underrail", "save-editor", "respec", "local-tool"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/MotionCorrect/underrail-respec-editor"
Issues = "https://github.com/MotionCorrect/underrail-respec-editor/issues"

[project.scripts]
underrail-respec-api = "underrail_respec_editor.web_app:main"
underrail-respec-save = "underrail_respec_editor.save_tool:main"
underrail-respec-crawl-wiki = "underrail_respec_editor.wiki_crawler:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
underrail_respec_editor = ["data/*.json"]
