[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "underrail-respec-editor"
version = "0.0.1"
description = "Local clone-first Underrail save respec editor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MotionCorrect" }]
keywords = ["underrail", "save-editor", "respec", "local-tool"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/MotionCorrect/underrail-respec-editor"
Issues = "https://github.com/MotionCorrect/underrail-respec-editor/issues"

[project.scripts]
underrail-respec-api = "underrail_webapp:main"

[tool.setuptools]
py-modules = ["underrail_savetool", "underrail_webapp", "crawl_underrail_feats"]
include-package-data = true

[tool.setuptools.data-files]
"share/underrail-respec-editor" = ["feat_rules.json", "feat_ids.json", "wiki_tooltips.json", "feat_crawl_report.json"]
